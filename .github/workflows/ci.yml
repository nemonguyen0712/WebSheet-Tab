# Checks every push and pull request: TypeScript errors, the Cloudflare Worker build, and its size.
# Deploying is done by Cloudflare (Workers Builds, see DEPLOY.md B.2) or `npm run deploy` from a computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build the Worker (lite, as deployed on the Workers Free plan)
        run: npx opennextjs-cloudflare build
        env:
          OLIU_LITE: "1"
      - name: Worker size (Free plan limit is 3 MB compressed)
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler-dry | tee wrangler-dry.txt
          node -e '
            const m = /gzip: ([\d.]+) KiB/.exec(require("fs").readFileSync("wrangler-dry.txt", "utf8"));
            if (!m) throw new Error("size not found in wrangler output");
            const kib = Number(m[1]);
            console.log(`Worker: ${kib} KiB compressed (limit 3072 KiB on Workers Free)`);
            if (kib > 3000) { console.error("Too big for Workers Free: trim the bundle or move to Workers Paid."); process.exit(1); }
          '
