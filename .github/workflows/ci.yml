# Checks every push and pull request: TypeScript errors, the Cloudflare Worker build, and its size.
# Deploying is done by Cloudflare (Workers Builds, see DEPLOY.md B.2) or `npm run deploy` from a computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build the Worker (lite, as deployed on the Workers Free plan)
        run: npx opennextjs-cloudflare build
        env:
          OLIU_LITE: "1"
      - name: Worker size (Free plan limit is 3 MB compressed)
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler-dry > wrangler-dry.txt 2>&1 || true
          cat wrangler-dry.txt
          # Results go out as annotations (::notice:: / ::error::), readable on the run page without opening logs.
          node -e '
            const out = require("fs").readFileSync("wrangler-dry.txt", "utf8");
            const m = /gzip: ([\d.]+) KiB/.exec(out);
            if (!m) {
              const tail = out.trim().split("\n").slice(-12).join("%0A");
              console.log(`::error title=wrangler dry-run failed::${tail}`);
              process.exit(1);
            }
            const kib = Number(m[1]);
            if (kib > 3000) {
              console.log(`::error title=Worker too big for Workers Free::${kib} KiB compressed (limit 3072 KiB). Trim the bundle or move to Workers Paid.`);
              process.exit(1);
            }
            console.log(`::notice title=Worker size::${kib} KiB compressed (Workers Free limit 3072 KiB)`);
          '
